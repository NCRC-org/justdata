name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - staging
      - testing
  workflow_dispatch:  # Allow manual trigger

env:
  PROJECT_ID: justdata-ncrc
  REGION: us-east1
  REPOSITORY: justdata-repo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment target based on branch
        run: |
          # JUSTDATA_ENV picks the BigQuery cache dataset at runtime, so tester
          # traffic on justdata-testing never lands in the same tables as prod.
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "DEPLOY_SERVICE_NAME=justdata" >> $GITHUB_ENV
            echo "JUSTDATA_ENV=production" >> $GITHUB_ENV
            echo "🚀 Deploying to PRODUCTION (justdata)"
          elif [[ "${{ github.ref }}" == "refs/heads/testing" ]]; then
            echo "DEPLOY_SERVICE_NAME=justdata-testing" >> $GITHUB_ENV
            echo "JUSTDATA_ENV=testing" >> $GITHUB_ENV
            echo "🧑‍🔬 Deploying to EXTERNAL TESTING (justdata-testing)"
          else
            echo "DEPLOY_SERVICE_NAME=justdata-test" >> $GITHUB_ENV
            echo "JUSTDATA_ENV=staging" >> $GITHUB_ENV
            echo "🧪 Deploying to DEV (justdata-test)"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Same JSON keys as local .env — pushes new SM versions before deploy. Requires the SA in
      # GCP_SERVICE_ACCOUNT_KEY to have secretmanager.versions.add (see migration README). If not,
      # this step fails but deploy continues using existing Secret Manager versions.
      - id: sync-secrets
        name: Sync credential JSON to Secret Manager
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          LENDSIGHT_CREDENTIALS_JSON: ${{ secrets.LENDSIGHT_CREDENTIALS_JSON }}
          BIZSIGHT_CREDENTIALS_JSON: ${{ secrets.BIZSIGHT_CREDENTIALS_JSON }}
          BRANCHSIGHT_CREDENTIALS_JSON: ${{ secrets.BRANCHSIGHT_CREDENTIALS_JSON }}
          BRANCHMAPPER_CREDENTIALS_JSON: ${{ secrets.BRANCHMAPPER_CREDENTIALS_JSON }}
          MERGERMETER_CREDENTIALS_JSON: ${{ secrets.MERGERMETER_CREDENTIALS_JSON }}
          DATAEXPLORER_CREDENTIALS_JSON: ${{ secrets.DATAEXPLORER_CREDENTIALS_JSON }}
          ANALYTICS_CREDENTIALS_JSON: ${{ secrets.ANALYTICS_CREDENTIALS_JSON }}
          ELECTWATCH_CREDENTIALS_JSON: ${{ secrets.ELECTWATCH_CREDENTIALS_JSON }}
        run: python3 scripts/sync_cloudrun_bq_secrets.py --project ${{ env.PROJECT_ID }}

      - name: Note if Secret Manager sync failed
        if: steps.sync-secrets.outcome == 'failure'
        run: |
          echo "::warning::Secret Manager sync failed — deploy still runs with existing secret versions. Grant roles/secretmanager.secretVersionAdder (or Secret Manager Admin) on project justdata-ncrc to the service account in GCP_SERVICE_ACCOUNT_KEY (e.g. github-deploy@...). See scripts/migration/README.md."
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Secret Manager sync failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The GitHub deploy SA needs permission to **add secret versions** (e.g. \`roles/secretmanager.secretVersionAdder\`). Until fixed, run \`scripts/sync_cloudrun_bq_secrets.py\` locally or update secrets in the console." >> "$GITHUB_STEP_SUMMARY"

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile.app \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.DEPLOY_SERVICE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.DEPLOY_SERVICE_NAME }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.DEPLOY_SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.DEPLOY_SERVICE_NAME }}:latest

      # Secrets the app runs fine without. FDIC_API_KEY only raises BranchMapper's
      # FDIC rate limit; the code already falls back to unauthenticated calls.
      # Referencing one that does not exist fails revision creation, and because
      # --update-secrets is additive the bad reference then persists in the service
      # spec and breaks every later deploy, including ones that never mention it.
      # So: attach an optional secret when it exists, and explicitly remove the
      # reference when it does not, which also clears a stale one.
      - name: Resolve optional secrets
        run: |
          OPTIONAL_SECRETS="FDIC_API_KEY=fdic-api-key"
          UPDATE=""
          REMOVE=""
          for pair in $OPTIONAL_SECRETS; do
            env_name="${pair%%=*}"
            secret_name="${pair##*=}"
            if gcloud secrets describe "$secret_name" --project="${{ env.PROJECT_ID }}" >/dev/null 2>&1; then
              UPDATE="${UPDATE:+$UPDATE,}${env_name}=${secret_name}:latest"
            else
              echo "::warning::Optional secret '$secret_name' not found in ${{ env.PROJECT_ID }}; deploying without $env_name"
              REMOVE="${REMOVE:+$REMOVE,}${env_name}"
            fi
          done
          echo "OPTIONAL_SECRETS_UPDATE=$UPDATE" >> $GITHUB_ENV
          echo "OPTIONAL_SECRETS_REMOVE=$REMOVE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          # gcloud allows --update-secrets and --remove-secrets together and
          # applies the removals first, which is what makes this self-healing.
          OPTIONAL_ARGS=()
          if [ -n "$OPTIONAL_SECRETS_REMOVE" ]; then
            OPTIONAL_ARGS+=(--remove-secrets "$OPTIONAL_SECRETS_REMOVE")
          fi
          if [ -n "$OPTIONAL_SECRETS_UPDATE" ]; then
            OPTIONAL_ARGS+=(--update-secrets "$OPTIONAL_SECRETS_UPDATE")
          fi

          gcloud run deploy ${{ env.DEPLOY_SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.DEPLOY_SERVICE_NAME }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --timeout 3600 \
            --max-instances 10 \
            --min-instances 0 \
            --set-env-vars "GCP_PROJECT_ID=${{ env.PROJECT_ID }}" \
            --set-env-vars "USE_SUMMARY_TABLES=false" \
            --set-env-vars "PYTHONPATH=/app" \
            --set-env-vars "JUSTDATA_ENV=${{ env.JUSTDATA_ENV }}" \
            --set-env-vars "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}" \
            --set-env-vars "MAPBOX_STYLE=${{ secrets.MAPBOX_STYLE }}" \
            --update-secrets "CLAUDE_API_KEY=claude-api-key:latest" \
            --update-secrets "ANTHROPIC_API_KEY=claude-api-key:latest" \
            --update-secrets "CENSUS_API_KEY=census-api-key:latest" \
            --update-secrets "GOOGLE_APPLICATION_CREDENTIALS_JSON=bigquery-credentials:latest" \
            --update-secrets "FIREBASE_CREDENTIALS_JSON=firebase-admin-credentials:latest" \
            --update-secrets "LENDSIGHT_CREDENTIALS_JSON=lendsight-bq-credentials:latest" \
            --update-secrets "BIZSIGHT_CREDENTIALS_JSON=bizsight-bq-credentials:latest" \
            --update-secrets "BRANCHSIGHT_CREDENTIALS_JSON=branchsight-bq-credentials:latest" \
            --update-secrets "BRANCHMAPPER_CREDENTIALS_JSON=branchmapper-bq-credentials:latest" \
            --update-secrets "MERGERMETER_CREDENTIALS_JSON=mergermeter-bq-credentials:latest" \
            --update-secrets "DATAEXPLORER_CREDENTIALS_JSON=dataexplorer-bq-credentials:latest" \
            --update-secrets "ANALYTICS_CREDENTIALS_JSON=analytics-bq-credentials:latest" \
            --update-secrets "ELECTWATCH_CREDENTIALS_JSON=electwatch-bq-credentials:latest" \
            --update-secrets "MERGERMETER_API_KEY=mergermeter-api-key:latest" \
            "${OPTIONAL_ARGS[@]}"

      - name: Get Service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.DEPLOY_SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format "value(status.url)")
          echo "## Deployment Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service URL:** $SERVICE_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Available Apps:" >> $GITHUB_STEP_SUMMARY
          echo "- Landing Page: $SERVICE_URL/" >> $GITHUB_STEP_SUMMARY
          echo "- BranchSight: $SERVICE_URL/branchsight/" >> $GITHUB_STEP_SUMMARY
          echo "- BizSight: $SERVICE_URL/bizsight/" >> $GITHUB_STEP_SUMMARY
          echo "- LendSight: $SERVICE_URL/lendsight/" >> $GITHUB_STEP_SUMMARY
          echo "- MergerMeter: $SERVICE_URL/mergermeter/" >> $GITHUB_STEP_SUMMARY
          echo "- BranchMapper: $SERVICE_URL/branchmapper/" >> $GITHUB_STEP_SUMMARY
          echo "- ElectWatch: $SERVICE_URL/electwatch/" >> $GITHUB_STEP_SUMMARY
