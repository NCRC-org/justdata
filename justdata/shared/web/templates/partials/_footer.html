<!-- Shell footer. Variables: app_name (optional), platform_version (from inject_shell()). -->
<footer class="shell-footer">
    <div class="shell-footer-inner">
        <div class="shell-footer-col">
            <p class="shell-footer-copyright">&copy; <span id="shellFooterYear"></span> National Community Reinvestment Coalition</p>
            {% if platform_version %}<p class="shell-footer-version">{{ app_name|default('JustData') }} v{{ platform_version }}</p>{% endif %}
            <p class="shell-footer-credits">Created by Jay Richardson &amp; Jad Edlebi</p>
        </div>
        <div class="shell-footer-col shell-footer-links">
            <a href="mailto:research@ncrc.org">research@ncrc.org</a>
            <a href="tel:+12024644600">(202) 464-4600</a>
            <a href="/privacy">Privacy</a>
            <a href="/terms">Terms</a>
        </div>
        <div class="shell-footer-col shell-footer-logo">
            <img src="{{ url_for('static', filename='img/ncrc-logo-white.png') }}" alt="NCRC" onerror="this.style.display='none';">
        </div>
    </div>
</footer>
<script>
(function () {
    var y = document.getElementById('shellFooterYear');
    if (y) { y.textContent = new Date().getFullYear(); }
})();
</script>
