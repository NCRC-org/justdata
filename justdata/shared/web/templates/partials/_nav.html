<!-- Off-canvas nav sidebar. Server-rendered from visible_apps (see main/app.py inject_shell());
     no client-side access filtering.

     `request` is only checked with `is defined`: most routes render via Flask's
     render_template() (request is always present there), but admin_users()
     still uses a raw jinja2.Environment that never gets Flask's request
     global -- fixed properly when step 4 converts that route. Until then
     this just skips the active-item highlight there instead of crashing
     with UndefinedError. -->
<div class="nav-backdrop" id="navBackdrop" aria-hidden="true"></div>

<nav class="nav-sidebar" id="navSidebar" aria-label="Main navigation" role="navigation">
    <div class="nav-sidebar-header">
        <h2 class="nav-sidebar-title">JustData</h2>
        <button type="button" class="nav-close-btn" id="navCloseBtn" aria-label="Close navigation menu">
            <i data-lucide="x" aria-hidden="true"></i>
        </button>
    </div>
    <div class="nav-sidebar-items">
        <a href="/" class="nav-item{% if request is defined and request.path == '/' %} is-active{% endif %}" data-app="home">
            <span>Home</span>
        </a>
        <a href="/apps" class="nav-item{% if request is defined and request.path == '/apps' %} is-active{% endif %}" data-app="apps">
            <span>Apps</span>
        </a>
        {% for app in visible_apps %}
        <a href="{{ app.url }}" class="nav-item{% if app.access == 'locked' %} is-locked{% endif %}{% if request is defined and request.path.startswith(app.url) %} is-active{% endif %}" data-app="{{ app.key }}"{% if app.access == 'locked' %} aria-disabled="true"{% endif %}>
            <span>{{ app.name }}</span>
            {% if app.access == 'locked' %}<i data-lucide="lock" aria-hidden="true"></i>{% endif %}
        </a>
        {% endfor %}
    </div>
    <div class="nav-sidebar-footer">
        <a href="/about" class="nav-sidebar-footer-link">About</a>
        <a href="/contact" class="nav-sidebar-footer-link">Contact</a>
    </div>
</nav>
