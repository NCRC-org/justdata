<!-- Sign in / register modal. Every id below is read by shell-auth.js and/or auth.js -- do not rename. -->
<div id="loginModal" class="shell-modal" style="display: none;">
    <div class="shell-modal-content">
        <button type="button" class="shell-modal-close" onclick="closeLoginModal()" aria-label="Close">
            <i data-lucide="x" aria-hidden="true"></i>
        </button>

        <div id="authTabs" class="auth-tabs">
            <button type="button" id="signInTab" class="auth-tab is-active" onclick="switchAuthTab('signin')">Sign In</button>
            <button type="button" id="registerTab" class="auth-tab" onclick="switchAuthTab('register')">Create Account</button>
        </div>

        <div id="signInView">
            <form id="emailLoginForm" onsubmit="handleEmailLogin(event)">
                <div class="form-field">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required autocomplete="email">
                </div>
                <div class="form-field">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <div id="loginError" class="alert alert-danger" style="display: none;"></div>
                <button type="submit" id="emailLoginBtn" class="btn btn-primary shell-modal-submit">
                    <span id="emailLoginText">Sign In</span>
                    <span id="emailLoginSpinner" style="display: none;"><i data-lucide="loader-circle" class="is-spinning" aria-hidden="true"></i> Signing in...</span>
                </button>
            </form>
        </div>

        <div id="registerView" style="display: none;">
            <form id="emailRegisterForm" onsubmit="handleEmailRegister(event)">
                <div class="shell-modal-form-row">
                    <div class="form-field">
                        <label for="registerFirstName">First Name <span class="required">*</span></label>
                        <input type="text" id="registerFirstName" placeholder="First name" required autocomplete="given-name">
                    </div>
                    <div class="form-field">
                        <label for="registerLastName">Last Name <span class="required">*</span></label>
                        <input type="text" id="registerLastName" placeholder="Last name" required autocomplete="family-name">
                    </div>
                </div>
                <div class="form-field">
                    <label for="registerEmail">Email <span class="required">*</span></label>
                    <input type="email" id="registerEmail" placeholder="Enter your email" required autocomplete="email">
                    <p class="form-hint"><i data-lucide="info" aria-hidden="true"></i> NCRC staff: use your @ncrc.org email for automatic staff access after verification</p>
                </div>
                <div class="form-field">
                    <label for="registerOrganization">Organization <span class="required">*</span></label>
                    <input type="text" id="registerOrganization" placeholder="Your organization or company" required autocomplete="organization">
                </div>
                <div class="form-field">
                    <label for="registerPassword">Password <span class="required">*</span></label>
                    <input type="password" id="registerPassword" placeholder="Create a password (min 6 characters)" required autocomplete="new-password" minlength="6">
                </div>
                <div class="form-field">
                    <label for="registerPasswordConfirm">Confirm Password</label>
                    <input type="password" id="registerPasswordConfirm" placeholder="Confirm your password" required autocomplete="new-password" minlength="6">
                </div>
                <div id="registerError" class="alert alert-danger" style="display: none;"></div>
                <div id="registerSuccess" class="alert alert-success" style="display: none;"></div>
                <button type="submit" id="emailRegisterBtn" class="btn btn-primary shell-modal-submit">
                    <span id="emailRegisterText">Create Account</span>
                    <span id="emailRegisterSpinner" style="display: none;"><i data-lucide="loader-circle" class="is-spinning" aria-hidden="true"></i> Creating account...</span>
                </button>
            </form>
        </div>

        <div class="shell-modal-divider"><span>OR</span></div>

        <button type="button" onclick="handleGoogleLogin()" id="googleLoginBtn" class="btn btn-secondary shell-modal-submit shell-google-btn">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            <span id="googleLoginText">Continue with Google</span>
            <span id="googleLoginSpinner" style="display: none;"><i data-lucide="loader-circle" class="is-spinning" aria-hidden="true"></i></span>
        </button>

        <p class="shell-modal-footnote">By signing in, you agree to NCRC's Terms of Service</p>
    </div>
</div>
